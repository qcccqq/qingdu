<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>轻读 · Word 快速阅读器</title>
<!--
  轻读 — Word 快速阅读器
  本应用内嵌以下开源库（均从 npm 官方源下载并经 SHA-512 完整性校验）：
  1. JSZip 3.10.2 —— MIT License（本应用选择 MIT 条款）
     Copyright (c) 2009-2016 Stuart Knightley, David Duponchel, Franz Buchinger, Antonio Afonso
  2. docx-preview 0.4.1 —— Apache License 2.0
     Copyright Volodymyr Baydalka  https://github.com/VolodymyrBaydalka/docxjs
  3. fflate 0.8.3 —— MIT License
     Copyright (c) 2021 Arjun Barrett
  其余部分为原创代码。
-->
<style>
:root {
  --topbar-h: 52px;
  --accent: #2e74b5;
  --bg: #808080;
  --line: #e0e0e0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--bg);
  overflow: hidden;
}
#topbar {
  height: var(--topbar-h);
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  user-select: none;
}
#brand { font-size: 19px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
#filename {
  flex: 1; min-width: 60px;
  color: #444; font-size: 13px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.group {
  display: none;
  align-items: center;
  gap: 4px;
}
.group.on { display: flex; }
.tbtn {
  min-width: 26px; height: 26px;
  padding: 0 6px;
  border: 1px solid #d0d0d0; border-radius: 6px;
  background: #fff; cursor: pointer;
  font-size: 12px; color: #333;
  line-height: 1;
}
.tbtn:hover:not(:disabled) { background: #f2f6fb; border-color: var(--accent); }
.tbtn:disabled { color: #bbb; cursor: default; }
#search-box { display: flex; align-items: center; gap: 4px; }
#search-input {
  width: 150px; height: 28px;
  border: 1px solid #d0d0d0; border-radius: 6px;
  padding: 0 8px; font-size: 13px;
  outline: none;
}
#search-input:focus { border-color: var(--accent); }
#hit-count { font-size: 12px; color: #666; min-width: 44px; text-align: center; }
#page-ind { font-size: 12px; color: #555; white-space: nowrap; }
#zoomval { font-size: 12px; color: #666; min-width: 40px; text-align: center; }
#btn-open {
  height: 32px; padding: 0 14px;
  border: none; border-radius: 7px;
  background: var(--accent); color: #fff;
  font-size: 13px; cursor: pointer;
  white-space: nowrap;
}
#btn-open:hover { filter: brightness(1.1); }
#btn-recents { position: relative; }
#recent-menu {
  position: absolute;
  top: 34px; right: 0;
  width: 280px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 6px 24px rgba(0,0,0,.15);
  padding: 6px;
  display: none;
  z-index: 50;
}
#recent-menu.on { display: block; }
#recent-menu .rm-empty { padding: 12px; text-align: center; color: #999; font-size: 12px; }
#recent-menu .rm-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 6px;
  cursor: pointer; font-size: 13px; color: #333;
}
#recent-menu .rm-item:hover { background: #f2f6fb; }
#recent-menu .rm-item .rm-name {
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#recent-menu .rm-item .rm-del {
  width: 20px; height: 20px; line-height: 18px;
  text-align: center; border-radius: 50%;
  color: #bbb; font-size: 13px;
}
#recent-menu .rm-item .rm-del:hover { background: #fee; color: #c33; }
#stage {
  position: absolute;
  top: var(--topbar-h);
  left: 0; right: 0; bottom: 0;
  overflow: auto;
}
#stage::-webkit-scrollbar { width: 12px; height: 12px; }
#stage::-webkit-scrollbar-thumb { background: #aab2bd; border-radius: 6px; border: 3px solid var(--bg); }
#stage::-webkit-scrollbar-track { background: transparent; }
#dropzone {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  cursor: pointer;
}
#dropzone[hidden] { display: none; }
#dropzone .dz-icon { font-size: 64px; }
#dropzone .dz-title { font-size: 22px; color: #fff; font-weight: 600; }
#dropzone .dz-hint { font-size: 13px; color: rgba(255,255,255,.85); }

/* ============ 首页（空状态）============ */
#home {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 24px 24px;
  background: radial-gradient(1200px 600px at 50% -10%, #3d5a80 0%, #293241 55%, #222b38 100%);
  animation: homeIn .5s ease both;
}
#home[hidden] { display: none; }
@keyframes homeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes floatDoc { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
@keyframes docIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.hero { text-align: center; color: #fff; }
.hero-mark {
  width: 84px; height: 84px; margin: 0 auto 14px;
  border-radius: 22px;
  background: linear-gradient(135deg, #2e74b5, #1e5799);
  box-shadow: 0 10px 30px rgba(46,116,181,.4), inset 0 1px 0 rgba(255,255,255,.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
  animation: floatDoc 5s ease-in-out infinite;
}
.hero-title { font-size: 34px; font-weight: 700; letter-spacing: 6px; margin-bottom: 8px; }
.hero-sub { font-size: 14px; color: rgba(255,255,255,.75); margin-bottom: 26px; }
.hero-actions { margin-bottom: 10px; }
.btn-primary {
  height: 42px; padding: 0 30px;
  border: none; border-radius: 10px;
  background: linear-gradient(135deg, #2e74b5, #1e5799);
  color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  box-shadow: 0 4px 14px rgba(46,116,181,.45);
  transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(46,116,181,.55); filter: brightness(1.08); }
.btn-primary:active { transform: translateY(0); }
.hero-hint { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 10px; }
.home-recents { width: 100%; max-width: 560px; margin-top: 34px; animation: fadeUp .5s .15s ease both; }
.hr-title { font-size: 12px; color: rgba(255,255,255,.55); letter-spacing: 2px; margin-bottom: 10px; text-align: left; }
.hr-list { display: flex; flex-direction: column; gap: 8px; }
.hr-item {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 10px; padding: 11px 14px;
  color: #eef2f7; font-size: 13px; cursor: pointer;
  transition: background .18s ease, transform .18s ease;
  animation: fadeUp .4s ease both;
}
.hr-item:hover { background: rgba(255,255,255,.16); transform: translateX(4px); }
.hr-item .ic { opacity: .8; }
.hr-item .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hr-item .del { color: rgba(255,255,255,.4); padding: 0 4px; border-radius: 4px; }
.hr-item .del:hover { color: #ff9c9c; background: rgba(0,0,0,.2); }
.hr-empty { color: rgba(255,255,255,.45); font-size: 12px; text-align: center; padding: 10px; }
.home-foot { margin-top: auto; padding-top: 30px; font-size: 11px; color: rgba(255,255,255,.35); }
.home-foot .ver { color: rgba(255,255,255,.55); }
@media (prefers-reduced-motion: reduce) {
  #home, .home-recents, .hr-item { animation: none !important; }
  .hero-mark { animation: none !important; }
  * { transition-duration: .01ms !important; }
}
#stage.dragging::after {
  content: "";
  position: absolute; inset: 10px;
  border: 3px dashed #cfe3f7;
  border-radius: 10px;
  pointer-events: none;
}
#viewer { min-height: 100%; }
#viewer[hidden] { display: none; }
#viewer.doc-in .docx-wrapper { animation: docIn .35s ease both; }
mark.qdu-hit { background: #ffe066; color: inherit; padding: 0; }
mark.qdu-hit.qdu-cur { background: #ff8c69; }
#error {
  margin: 80px auto;
  max-width: 460px;
  background: #fff4f4;
  border: 1px solid #e8b4b4;
  border-radius: 10px;
  padding: 18px 22px;
  color: #a33;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
}
#error[hidden] { display: none; }
#error { cursor: pointer; }

/* ============ 编辑模式 ============ */
#edit-bar {
  display: none;
  align-items: center;
  gap: 6px;
}
#edit-bar.on { display: flex; }
#edit-tip {
  position: fixed; top: var(--topbar-h); left: 0; right: 0;
  background: #2e74b5; color: #fff;
  font-size: 12px; text-align: center; padding: 4px 0;
  z-index: 40; display: none;
}
#edit-tip.on { display: block; }
body.editing #viewer p[contenteditable] {
  outline: 1px dashed rgba(46,116,181,.55);
  outline-offset: 2px;
  cursor: text;
}
body.editing #viewer p[contenteditable]:hover {
  outline: 1px solid rgba(46,116,181,.8);
  background: rgba(46,116,181,.05);
}
body.editing #viewer p[contenteditable]:focus {
  outline: 2px solid #2e74b5;
  background: rgba(46,116,181,.04);
}
#btn-edit { color: #2e74b5; border-color: #2e74b5; }
body.editing #btn-edit { background: #2e74b5; color: #fff; border-color: #2e74b5; }
.ebtn {
  min-width: 26px; height: 26px; padding: 0 7px;
  border: 1px solid #d0d0d0; border-radius: 6px;
  background: #fff; cursor: pointer; font-size: 12px; color: #333;
}
.ebtn:hover:not(:disabled) { background: #f2f6fb; border-color: #2e74b5; }
.ebtn:disabled { color: #bbb; cursor: default; }
.ebtn.bold { font-weight: 800; }
.ebtn.italic { font-style: italic; }
#e-fontsize { height: 26px; border: 1px solid #d0d0d0; border-radius: 6px; font-size: 12px; padding: 0 4px; }
#e-color { width: 26px; height: 26px; padding: 0; border: 1px solid #d0d0d0; border-radius: 6px; background: #fff; cursor: pointer; }
#update-panel {
  position: fixed; right: 14px; top: 60px; width: 330px;
  background: #1f2430; color: #d8e0ea; border-radius: 10px;
  padding: 12px 14px; font-size: 12px; line-height: 1.7;
  box-shadow: 0 8px 30px rgba(0,0,0,.35); z-index: 100;
  display: none; max-height: 320px; overflow: auto;
}
#update-panel.on { display: block; }
#update-panel .up-title { font-weight: 700; color: #fff; margin-bottom: 6px; font-size: 13px; }
#update-panel .up-line { white-space: pre-wrap; word-break: break-all; }
#update-panel .up-line.err { color: #ff9c9c; }
#update-panel .up-line.ok { color: #9fe0a8; }
</style>
</head>
<body>
<header id="topbar">
  <div id="brand">轻读</div>
  <div id="filename"></div>
  <div id="search-box" class="group">
    <input id="search-input" type="text" placeholder="搜索 (Ctrl+F)" disabled>
    <span id="hit-count"></span>
    <button class="tbtn" id="hit-prev" title="上一个 (Shift+Enter)" disabled>↑</button>
    <button class="tbtn" id="hit-next" title="下一个 (Enter)" disabled>↓</button>
  </div>
  <div id="page-box" class="group">
    <button class="tbtn" id="page-prev" title="上一页" disabled>‹</button>
    <span id="page-ind">- / -</span>
    <button class="tbtn" id="page-next" title="下一页" disabled>›</button>
  </div>
  <div id="zoom-box" class="group">
    <button class="tbtn" id="zoom-out" title="缩小 (Ctrl+-)">−</button>
    <span id="zoomval">100%</span>
    <button class="tbtn" id="zoom-in" title="放大 (Ctrl++)">＋</button>
    <button class="tbtn" id="zoom-fit" title="适应宽度" style="width:auto">适宽</button>
  </div>
  <div id="edit-bar">
    <button class="ebtn bold" id="e-bold" title="加粗（作用于本段首个文字块）">B</button>
    <button class="ebtn italic" id="e-italic" title="倾斜">I</button>
    <select id="e-fontsize" title="字号（磅）">
      <option value="" selected>字号</option>
      <option value="21">10.5</option><option value="24">12</option><option value="28">14</option>
      <option value="32">16</option><option value="36">18</option><option value="44">22</option>
    </select>
    <input type="color" id="e-color" title="文字颜色" value="#000000">
    <span style="width:8px"></span>
    <button class="ebtn" id="e-undo" title="撤销 (Ctrl+Z)" disabled>↩</button>
    <button class="ebtn" id="e-redo" title="重做 (Ctrl+Y)" disabled>↪</button>
    <button class="ebtn" id="e-save" title="保存 (Ctrl+S)，自动留 .bak 备份" style="color:#1e8e3e;border-color:#1e8e3e">保存</button>
  </div>
  <button class="tbtn" id="btn-recents" title="最近打开">最近 ▾</button>
  <div id="recent-menu"></div>
  <button class="tbtn" id="btn-edit" title="切换编辑模式" style="width:auto">编辑</button>
  <button class="tbtn" id="btn-update" title="检查更新" style="width:auto">检查更新</button>
  <button id="btn-open">打开文档</button>
  <input type="file" id="file-input" accept=".docx" hidden>
</header>
<main id="stage">
  <div id="home">
    <div class="hero">
      <div class="hero-mark">📄</div>
      <div class="hero-title">轻 读</div>
      <div class="hero-sub">秒开的 Word 阅读器 · 全程本地处理 · 无网络依赖</div>
      <div class="hero-actions"><button class="btn-primary" id="btn-open-hero">打开文档</button></div>
      <div class="hero-hint">支持 .docx · 也可以直接把文件拖进窗口</div>
    </div>
    <div class="home-recents">
      <div class="hr-title">最 近 文 档</div>
      <div class="hr-list" id="home-recent-list"><div class="hr-empty">暂无记录</div></div>
    </div>
    <div class="home-foot"><span class="ver" id="home-ver"></span> · 文档不出本机</div>
  </div>
  <div id="viewer" hidden></div>
  <div id="error" hidden title="点击返回首页"></div>
</main>
<div id="update-panel"><div class="up-title">更新日志</div><div id="up-log"></div></div>
<script src="libs/jszip.min.js"></script>
<script src="libs/docx-preview.min.js"></script>
<script src="libs/fflate.min.js"></script>
<script src="engine/engine.js"></script>
<script src="app.js"></script>
</body>
</html>
