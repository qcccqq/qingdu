name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 稳定版
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建轻读
        run: cargo tauri build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: qingdu-setup-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 整理发布物（固定名安装包 + 版本信息 + SHA-256）
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "qingdu-Setup.exe"
          $ver = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $hash = (Get-FileHash "qingdu-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          $json = @{ version = $ver; sha256 = $hash } | ConvertTo-Json -Compress
          # WriteAllText 写 UTF-8 无 BOM（Set-Content -Encoding UTF8 在 Windows PowerShell 会写 BOM，serde_json 无法解析）
          [System.IO.File]::WriteAllText("$PWD/version.json", $json)
          Write-Output "version=$ver sha256=$hash"

      - name: 发布 Release（latest 标签，供应用内更新）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 轻读 最新版
          files: |
            qingdu-Setup.exe
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
