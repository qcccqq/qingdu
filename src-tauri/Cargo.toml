[package]
name = "qingdu"
version = "0.2.5"
description = "轻读 — Word 快速阅读器"
edition = "2021"

[lib]
name = "qingdu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["native-certs"] }
sha2 = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
